<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ThriftMate — pre-loved clothing marketplace.">
  <meta name="theme-color" content="#1F3D2E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ThriftMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ThriftMate</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #FAF6EF;
    }
    #tm-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1F3D2E;
      transition: opacity 240ms ease;
    }
    #tm-splash img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
    }
    #tm-splash span {
      margin-top: 18px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      color: #FAF6EF;
      letter-spacing: 0.3px;
    }
    #tm-splash small {
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: rgba(250, 246, 239, 0.75);
      letter-spacing: 0.2px;
    }
    #tm-splash.tm-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="tm-splash">
    <img src="icons/Icon-192.png" alt="ThriftMate">
    <span>ThriftMate</span>
    <small>Buy &amp; sell pre-loved clothing</small>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('tm-splash');
      if (!splash) return;
      splash.classList.add('tm-hide');
      setTimeout(function () { splash.remove(); }, 260);
    });
  </script>
</body>
</html>
