name: thriftmate
description: "ThriftMate - second-hand clothing marketplace."


version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App launcher icon settings (read by: dart run flutter_launcher_icons).
# This is its own top-level section, NOT inside dev_dependencies.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#E86F1A"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"

flutter:
  uses-material-design: true