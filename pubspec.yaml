name: thriftmate
description: "ThriftMate - second-hand clothing marketplace."


version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_stripe: 14.1.0
  cloud_functions: ^5.6.2
  flutter_stripe_web: ^8.2.0

# flutter_stripe_web 8.2.0 does not compile against stripe_platform_interface
# 14.2.0 (non-exhaustive switch on PaymentIntentsFutureUsage.None); pin until
# upstream ships a matching web release.
dependency_overrides:
  stripe_platform_interface: 14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App launcher icon settings (read by: dart run flutter_launcher_icons).
# This is its own top-level section, NOT inside dev_dependencies.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#1F3D2E"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#1F3D2E"
    theme_color: "#1F3D2E"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/onboarding/